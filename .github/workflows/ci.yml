name: CI & Release Installers

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: clop-rs-macos-arm64
          - os: windows-latest
            artifact_name: clop-rs-windows-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit & integration tests
        run: cargo test --verbose

      - name: Build optimized release binary
        run: cargo build --release --verbose

      - name: Package macOS Installers (.pkg, .dmg, .tar.gz)
        if: runner.os == 'macOS'
        run: |
          VERSION="${GITHUB_REF_NAME:-}"
          if [[ "$VERSION" != v* ]]; then
            CARGO_VER=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
            VERSION="v${CARGO_VER}"
          fi
          chmod +x scripts/package-macos.sh
          ./scripts/package-macos.sh "$VERSION" arm64
          cp scripts/install.sh dist/install.sh

      - name: Package Windows Installer & Archive (.zip & .exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = if ($env:GITHUB_REF_NAME -like "v*") {
            $env:GITHUB_REF_NAME
          } else {
            $CargoVer = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
            "v$CargoVer"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/clop-rs.exe "dist/clop-rs-$Version-windows-x64.exe"
          Copy-Item target/release/clop-cli.exe "dist/clop-cli-$Version-windows-x64.exe"
          $StageDir = "dist/clop-rs-$Version-windows-x64"
          New-Item -ItemType Directory -Force -Path $StageDir | Out-Null
          Copy-Item target/release/clop-rs.exe "$StageDir/clop-rs.exe"
          Copy-Item target/release/clop-cli.exe "$StageDir/clop-cli.exe"
          Copy-Item scripts/install.ps1 "$StageDir/install.ps1"
          Copy-Item README.md, LICENSE $StageDir
          Compress-Archive -Path "$StageDir/*" -DestinationPath "dist/clop-rs-$Version-windows-x64.zip" -Force
          Remove-Item -Recurse -Force $StageDir
          Copy-Item scripts/install.ps1 "dist/install.ps1"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-and-test]
    if: >-
      !cancelled() &&
      needs.build-and-test.result == 'success' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Update Homebrew & WinGet manifests with SHA256 checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/update-package-manifests.py "$RELEASE_TAG" release-assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/clop-rs.rb Casks/clop-rs.rb packaging/winget/
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update Homebrew & WinGet manifests for ${RELEASE_TAG} [skip ci]"
            git push origin main
          fi

      - name: Publish Installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
