name: CI & Release Installers

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-release:
    name: Bump Version & Tag Release
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Bump patch version, commit, and tag
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --tags --force
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)
          CARGO_VER=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')

          BASE_VER="$CARGO_VER"
          if [ -n "$LATEST_TAG" ]; then
            TAG_VER="${LATEST_TAG#v}"
            BASE_VER=$(printf '%s\n%s\n' "$CARGO_VER" "$TAG_VER" | sort -V | tail -n1)
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VER"
          NEW_VER="${MAJOR}.${MINOR}.$((PATCH + 1))"
          NEW_TAG="v${NEW_VER}"

          python3 - "$NEW_VER" <<'PY'
          import re, sys
          new_ver = sys.argv[1]

          with open("Cargo.toml", "r", encoding="utf-8") as f:
              toml = f.read()
          toml = re.sub(r'^version = "[^"]+"', f'version = "{new_ver}"', toml, count=1, flags=re.MULTILINE)
          with open("Cargo.toml", "w", encoding="utf-8") as f:
              f.write(toml)

          with open("Cargo.lock", "r", encoding="utf-8") as f:
              lock = f.read()
          lock = re.sub(
              r'(\[\[package\]\]\nname = "clop-rs"\nversion = ")[^"]+(")',
              rf'\g<1>{new_ver}\g<2>',
              lock,
              count=1,
          )
          with open("Cargo.lock", "w", encoding="utf-8") as f:
              f.write(lock)
          PY

          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): ${NEW_TAG} [skip ci]"
          git tag -a "$NEW_TAG" -m "Release ${NEW_TAG}"
          git push origin main
          git push origin "$NEW_TAG"

          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "Created release tag: ${NEW_TAG}"

  build-and-test:
    name: Build & Package (${{ matrix.os }})
    needs: prepare-release
    if: ${{ !cancelled() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: clop-rs-macos-arm64
          - os: windows-latest
            artifact_name: clop-rs-windows-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit & integration tests
        run: cargo test --verbose

      - name: Build optimized release binary
        run: cargo build --release --verbose

      - name: Package macOS Installers (.pkg, .dmg, .tar.gz)
        if: runner.os == 'macOS'
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          VERSION="${RELEASE_TAG:-${GITHUB_REF_NAME:-}}"
          if [[ "$VERSION" != v* ]]; then
            CARGO_VER=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
            VERSION="v${CARGO_VER}"
          fi
          chmod +x scripts/package-macos.sh
          ./scripts/package-macos.sh "$VERSION" arm64
          cp scripts/install.sh dist/install.sh

      - name: Package Windows Installer & Archive (.zip & .exe)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          $Version = if ($env:RELEASE_TAG -like "v*") {
            $env:RELEASE_TAG
          } elseif ($env:GITHUB_REF_NAME -like "v*") {
            $env:GITHUB_REF_NAME
          } else {
            $CargoVer = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
            "v$CargoVer"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/clop-rs.exe "dist/clop-rs-$Version-windows-x64.exe"
          Copy-Item target/release/clop-cli.exe "dist/clop-cli-$Version-windows-x64.exe"
          $StageDir = "dist/clop-rs-$Version-windows-x64"
          New-Item -ItemType Directory -Force -Path $StageDir | Out-Null
          Copy-Item target/release/clop-rs.exe "$StageDir/clop-rs.exe"
          Copy-Item target/release/clop-cli.exe "$StageDir/clop-cli.exe"
          Copy-Item scripts/install.ps1 "$StageDir/install.ps1"
          Copy-Item README.md, LICENSE $StageDir
          Compress-Archive -Path "$StageDir/*" -DestinationPath "dist/clop-rs-$Version-windows-x64.zip" -Force
          Remove-Item -Recurse -Force $StageDir
          Copy-Item scripts/install.ps1 "dist/install.ps1"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [prepare-release, build-and-test]
    if: >-
      !cancelled() &&
      needs.build-and-test.result == 'success' &&
      (needs.prepare-release.outputs.tag != '' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Update Homebrew & WinGet manifests with SHA256 checksums
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag || github.ref_name }}
        run: |
          python3 scripts/update-package-manifests.py "$RELEASE_TAG" release-assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/clop-rs.rb Casks/clop-rs.rb packaging/winget/
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update Homebrew & WinGet manifests for ${RELEASE_TAG} [skip ci]"
            git push origin main
          fi

      - name: Publish Installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag || github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
