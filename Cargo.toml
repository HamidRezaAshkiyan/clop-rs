[package]
name = "clop-rs"
version = "0.4.6"
edition = "2021"
description = "Minimal-footprint cross-platform (macOS & Windows) clipboard, file, video & PDF optimizer inspired by Clop"
license = "MIT"
authors = ["HamidReza Ashkiyan"]
repository = "https://github.com/HamidRezaAshkiyan/clop-rs"
keywords = ["clipboard", "image", "optimizer", "compression", "png"]
categories = ["command-line-utilities", "multimedia::images"]

[[bin]]
name = "clop-rs"
path = "src/main.rs"

[[bin]]
name = "clop-cli"
path = "src/bin/clop-cli.rs"

[dependencies]
anyhow = "1.0"
arboard = "3.4"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "5.0"
env_logger = "0.11"
flate2 = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
imagequant = "4.3"
log = "0.4"
mozjpeg = { version = "0.10", default-features = false }
oxipng = "9.1"
png = "0.17"
ratatui = "0.29"
raw-window-handle = "0.6"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tray-icon = "0.19"
tao = "0.30"
wry = "0.47"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
foreign-types = "0.5"
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSPasteboard", "NSApplication", "NSRunningApplication"] }
objc2-foundation = { version = "0.2", features = ["NSArray", "NSData", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
tempfile = "3.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
